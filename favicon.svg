    <path d="M16 28.5C16 28.5 2 19 2 9.5C2 4.8 5.8 1 10.5 1C13 1 15 2.2 16 4C17 2.2 19 1 21.5 1C26.2 1 30 4.8 30 9.5C30 19 16 28.5 16 28.5Z" fill="url(#yellow-grad)" />
    
